name: Update arXiv papers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8,22 * * *"

permissions:
  contents: write

concurrency:
  group: arxiv-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover --start-directory tests

      - name: Update paper archive and README
        run: python daily_arxiv.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/arxiv-daily.json

          if git diff --cached --quiet; then
            echo "No paper updates to commit."
            exit 0
          fi

          git commit -m "Update arXiv papers"
          git push
